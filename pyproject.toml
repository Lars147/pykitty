[tool.poetry]
name = "pykitty"
version = "0.4.0"
description = "The unofficial Kittysplit wrapper for Python."
authors = ["Lars Heinen"]
license = "MIT License"
readme = "README.md"

[tool.poetry.scripts]
pykitty = "pykitty.cli:app"

[tool.poetry.dependencies]
python = "^3.9"
requests = [
    {version = "2.32.5", python = "<3.10"},
    {version = "2.33.0", python = ">=3.10"},
]
typer = "0.23.2"
beautifulsoup4 = "4.15.0"
# Use the security fixes available for each Python version.
urllib3 = [
    {version = "~2.6.3", python = "<3.10"},
    {version = "^2.8.0", python = ">=3.10"},
]
soupsieve = [
    {version = "~2.8.4", python = "<3.10"},
    {version = "~2.10", python = ">=3.10,<3.11.5"},
    {version = "^4.0", python = ">=3.11.5"},
]

[tool.poetry.group.dev.dependencies]
# Both Black fixes require Python 3.10 or newer.
black = [
    {version = "24.8.0", python = "<3.10"},
    {version = "^26.10.1", python = ">=3.10"},
]
isort = "^6.1.0"
coverage = "^7.2.5"

[tool.isort]
profile = "black"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
