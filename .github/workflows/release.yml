name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event.deleted == false
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate release tag
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo '::error::The release tag must point to a commit on main.'
            exit 1
          fi

          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          config = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))
          expected_tag = f"v{config['tool']['poetry']['version']}"
          tag = os.environ['GITHUB_REF_NAME']
          if tag != expected_tag:
              raise SystemExit(f'{tag} does not match the package version ({expected_tag}).')
          PY

      - name: Build and check distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Test installed wheel
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip install "$GITHUB_WORKSPACE"/dist/*.whl
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p 'test_client.py'
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p 'test_parser.py'
          pykitty --help

      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/pykitty/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish GitHub release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --notes "[Install pykitty ${GITHUB_REF_NAME#v} from PyPI](https://pypi.org/project/pykitty/${GITHUB_REF_NAME#v}/)."
