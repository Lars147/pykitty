name: Deploy Function

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
    testing_and_coverage_upload:
        name: coverage
        runs-on: ubuntu-24.04

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Set up Python 3.8
              uses: actions/setup-python@v5
              with:
                python-version: 3.8
            - name: Install Poetry Action
              uses: snok/install-poetry@v1.3.4
              with:
                version: 1.8.2
            #----------------------------------------------
            #       load cached venv if cache exists
            #----------------------------------------------
            - name: Load cached venv
              id: cached-poetry-dependencies
              uses: actions/cache@v3
              with:
                path: .venv
                key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
            #----------------------------------------------
            # install dependencies if cache does not exist
            #----------------------------------------------
            - name: Install dependencies
              if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
              run: poetry install --no-interaction --no-root
            #----------------------------------------------
            # install your root project, if required
            #----------------------------------------------
            - name: Install project
              run: poetry install --no-interaction
            #----------------------------------------------
            #              run test suite
            #----------------------------------------------
            - name: Run tests
              env:
                E2E_KITTY_ID: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.E2E_KITTY_ID || '' }}
                E2E_KITTY_USERNAME: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.E2E_KITTY_USERNAME || '' }}
              run: |
                if [ -z "$E2E_KITTY_ID" ] || [ -z "$E2E_KITTY_USERNAME" ]; then
                  echo "::error::The live Kittysplit fixture secrets are unavailable for this run."
                  exit 1
                fi
                export E2E_KITTY_URL="https://www.kittysplit.com/k/$E2E_KITTY_ID"
                poetry run coverage run -m unittest discover tests
                poetry run coverage report -m
                poetry run coverage xml
            #----------------------------------------------
            #              upload coverage report
            #----------------------------------------------
            - name: Upload coverage reports to Codecov
              uses: codecov/codecov-action@v4.1.0
              env:
                CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
